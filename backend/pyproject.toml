[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "returnpilot-backend"
version = "0.1.0"
description = "ReturnPilot synthetic commerce support API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.3",
  "google-genai==2.31.0",
  "httpx2==2.13.1",
  "mcp==2.3.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "python-dotenv==1.2.2",
  "sqlalchemy==2.0.55",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
